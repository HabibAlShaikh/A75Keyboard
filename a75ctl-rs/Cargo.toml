[package]
name = "a75ctl"
version = "0.2.1"
edition = "2021"
description = "Fast Linux controller for the VGN A75 Hall-effect keyboard"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
